name: C++ CI with Cmake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # labeled: adding the `wheel` or `testpypi` label builds the wheel
    types: [opened, synchronize, reopened, labeled]
  # A manual release is this whole pipeline on main, the 48 hours lifted:
  # gh workflow run cmake.yml --ref main -f force=true
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the last release is under 48 hours old"
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.15"  # the latest stable, and the floor (pyproject.toml)

jobs:
  # The pipeline itself is build.yml, the runner its parameter: CI's on the
  # latest Ubuntu LTS, and the only one that reports coverage.
  build-and-deploy:
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-26.04
      upload-coverage: true
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  # The wheel, as a check: at 0.0.0.dev0, manylinux-tagged and checked
  # (make wheel), installed and used (make wheel-verify).  A PR labelled
  # `wheel` builds it too; one labelled `testpypi` at 0.0.0.dev<run id>, and
  # publishes it (testpypi-dev).  A release builds its own, from its tag.
  python-dist:
    if: >-
      ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
       contains(github.event.pull_request.labels.*.name, 'wheel') ||
       contains(github.event.pull_request.labels.*.name, 'testpypi'))
    needs: build-and-deploy
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    permissions:
      contents: read  # checkout only; no PR write or pages needed
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install clang build chain
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23

    # A dev version: a release builds its own wheel, from its tag.
    - name: The wheel at a dev version
      env:
        CC: clang-23
        CXX: clang++-23
        DEV: ${{ contains(github.event.pull_request.labels.*.name, 'testpypi') && github.run_id || '0' }}
      run: |
        echo "PYNZLI_VERSION=0.0.0.dev$DEV" >> "$GITHUB_ENV"
        make wheel VERSION="0.0.0.dev$DEV"

    - name: The wheel installed and used
      run: make wheel-verify VERSION="$PYNZLI_VERSION"

    - name: Upload Python Dist Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: python-dist
        path: |
          dist/*
          build/python-docs/dist-manifest.txt
          build/python-docs/dist-sha256.txt
          build/python-docs/install-report.txt
          build/python-docs/pydoc-pynzli.txt

  docs-and-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-deploy
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    permissions:
      contents: read
      pages: write       # required by actions/upload-pages-artifact + deploy-pages
      id-token: write    # required by actions/deploy-pages (OIDC verification)
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install clang build chain
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23

    - name: Install docs toolchains
      run: |
        make ci-install-doxygen-deps
        make ci-install-paper-deps

    - name: Build Doxygen and the papers in parallel
      run: |
        (
          make doxygen CXX=clang++-23 CC=clang-23 CMAKE_EXTRA_ARGS="-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON"
        ) &
        DOXYGEN_BUILD_PID=$!

        (
          make paper
          make -C docs/paper doc
          make paper-jlt
        ) &
        PAPER_BUILD_PID=$!

        wait "$DOXYGEN_BUILD_PID"
        wait "$PAPER_BUILD_PID"

    - name: Stage Pages content
      run: |
        mkdir -p build/pages
        cp -R build/docs/html/. build/pages/
        cp docs/paper/paper.pdf build/pages/paper.pdf
        cp docs/paper/jlt/jlt.pdf build/pages/jlt.pdf

    - name: Upload artifact
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
      with:
        path: 'build/pages'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # A PR labelled testpypi publishes its dev wheel, to try the publisher
  # before a release needs it.  The environment must admit the PR's branch.
  testpypi-dev:
    # !cancelled(): python-dist's own need, release-plan, is skipped on a PR,
    # and a job downstream of a skipped one is skipped unless it says so.
    if: >-
      !cancelled() && needs.python-dist.result == 'success' &&
      contains(github.event.pull_request.labels.*.name, 'testpypi')
    needs: python-dist
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pynzli
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - name: The wheel to publish
      uses: ./.github/actions/pypi-wheel
      with:
        version: 0.0.0.dev${{ github.run_id }}

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true  # a resumed release may have uploaded already

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: The wheel from TestPyPI
      run: make wheel-verify VERSION="0.0.0.dev${{ github.run_id }}" INDEX=testpypi

  # A release after a green build of main, at most once per 48 hours,
  # versioned 0.<YYYYMMDD>.<n>, PEP 440, the tag naming the commit (.github/scripts/release-version.sh).
  # It runs here rather than from a workflow_run event because such events
  # failed at startup on GitHub's side (nameless "BuildFailed" runs, 2026-10-25).
  # A manual release is a run of this workflow on main (workflow_dispatch,
  # force).  Three jobs: the plan, the macOS build (only when a release is
  # due), the release.
  #
  # Whether this commit is released: a tag of this commit whose release is
  # missing is resumed, else the next version, or "skip" inside the 48 hours.
  release-plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-and-deploy, docs-and-pages]
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    env:
      MIN_HOURS: "48"
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    - name: Plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
      run: .github/scripts/release-plan.sh "$GITHUB_SHA" "$MIN_HOURS" "$FORCE" >> "$GITHUB_OUTPUT"

  # A release is built on macOS too, by the same pipeline; CI is not (#1121).
  build-macos:
    needs: release-plan
    if: needs.release-plan.outputs.version != 'skip'
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-26
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  release:
    needs: [release-plan, build-macos, python-dist]
    if: needs.release-plan.outputs.version != 'skip'
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    # Trusted publishing (OIDC, no token): TestPyPI knows this workflow and
    # this environment as pynzli's publisher.
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pynzli
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      MIN_HOURS: "48"
    # The release, step by step: each step one call, so that this job read
    # back is the runbook of a release by hand.  By hand, an upload takes an
    # API token (twine upload) where this job has the OIDC publisher.
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Decided again here, inside the serialised group, against the tags as
    # they are now: another release may have been cut while macOS built.
    - name: 1. Plan, again
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
      run: .github/scripts/release-plan.sh "$GITHUB_SHA" "$MIN_HOURS" "$FORCE" >> "$GITHUB_OUTPUT"

    # The tag names the release; everything after it reads the version from
    # it.  A resumed release keeps its tag.
    - name: 2. Tag
      if: steps.plan.outputs.version != 'skip'
      env:
        TAG: ${{ steps.plan.outputs.version == 'resume' && steps.plan.outputs.tag || format('v{0}', steps.plan.outputs.version) }}
      run: .github/scripts/release-tag.sh "$TAG" "$GITHUB_SHA"

    - name: 3. The version, from the tag
      if: steps.plan.outputs.version != 'skip'
      run: echo "PYNZLI_VERSION=$(git describe --tags --exact-match HEAD | sed 's/^v//')" >> "$GITHUB_ENV"

    - name: Set up Python
      if: steps.plan.outputs.version != 'skip'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install clang build chain
      if: steps.plan.outputs.version != 'skip'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build

    - name: 4. The wheel, from the tag
      if: steps.plan.outputs.version != 'skip'
      env:
        CC: clang-23
        CXX: clang++-23
      run: make wheel VERSION="$PYNZLI_VERSION"

    # By hand: twine upload -r testpypi dist/*
    - name: 5. Publish to TestPyPI
      if: steps.plan.outputs.version != 'skip'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true  # a resumed release may have uploaded already

    - name: 6. The wheel from TestPyPI
      if: steps.plan.outputs.version != 'skip'
      run: make wheel-verify VERSION="$PYNZLI_VERSION" INDEX=testpypi

    # Irreversible from here: the GitHub release is archived by Zenodo, a DOI.
    - name: 7. GitHub release (Zenodo)
      if: steps.plan.outputs.version != 'skip'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "v$PYNZLI_VERSION" --verify-tag --title "v$PYNZLI_VERSION" --generate-notes

    # 8. PyPI, the same wheel (the next PR: environment pypi, main only).
