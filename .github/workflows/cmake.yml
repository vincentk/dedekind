name: C++ CI with Cmake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.15"  # the latest stable, and the floor (pyproject.toml)

jobs:
  # The pipeline itself is build.yml, the runner its parameter: CI's on the
  # latest Ubuntu LTS, and the only one that reports coverage.
  build-and-deploy:
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-26.04
      upload-coverage: true
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  python-dist:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-deploy
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    permissions:
      contents: read  # checkout only; no PR write or pages needed
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install clang build chain
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23

    - name: Build Python Distribution Artifacts
      env:
        CC: clang-23
        CXX: clang++-23
        CMAKE_ARGS: >-
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DCMAKE_CXX_SCAN_FOR_MODULES=ON
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check dist/*
        mkdir -p build/python-docs
        ls -lh dist | tee build/python-docs/dist-manifest.txt
        sha256sum dist/* | tee build/python-docs/dist-sha256.txt

    - name: Verify Installed Wheel Smoke Test
      run: |
        python -m venv .venv-wheel-smoke
        . .venv-wheel-smoke/bin/activate
        python -m pip install --upgrade pip
        python -m pip install dist/*.whl
        mkdir -p build/python-docs
        python -m pip show pydedekind > build/python-docs/install-report.txt
        python -m pydoc dedekind > build/python-docs/pydoc-dedekind.txt
        python - <<'PY'
        from dedekind.jlt import succ
        from dedekind.pst import A, image, u64, π

        U = A(u64)
        assert (U & (π > 3)) & (U & (π < 5)) == U & (π == 4)
        assert image(succ(int), U & (π > 5)) == U & ((π > 6) | (π == 0))
        print("python-wheel-smoke-ok")
        PY

    - name: Upload Python Dist Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: python-dist
        path: |
          dist/*
          build/python-docs/dist-manifest.txt
          build/python-docs/dist-sha256.txt
          build/python-docs/install-report.txt
          build/python-docs/pydoc-dedekind.txt

  docs-and-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-deploy
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    permissions:
      contents: read
      pages: write       # required by actions/upload-pages-artifact + deploy-pages
      id-token: write    # required by actions/deploy-pages (OIDC verification)
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install clang build chain
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23

    - name: Install docs toolchains
      run: |
        make ci-install-doxygen-deps
        make ci-install-paper-deps

    - name: Build Doxygen and the papers in parallel
      run: |
        (
          make doxygen CXX=clang++-23 CC=clang-23 CMAKE_EXTRA_ARGS="-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON"
        ) &
        DOXYGEN_BUILD_PID=$!

        (
          make paper
          make -C docs/paper doc
          make paper-jlt
        ) &
        PAPER_BUILD_PID=$!

        wait "$DOXYGEN_BUILD_PID"
        wait "$PAPER_BUILD_PID"

    - name: Stage Pages content
      run: |
        mkdir -p build/pages
        cp -R build/docs/html/. build/pages/
        cp docs/paper/paper.pdf build/pages/paper.pdf
        cp docs/paper/jlt/jlt.pdf build/pages/jlt.pdf

    - name: Upload artifact
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
      with:
        path: 'build/pages'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # A release after a green build of main, at most once per 48 hours,
  # versioned 0.<YYYYMMDD>.<n>, PEP 440, the tag naming the commit (.github/scripts/release-version.sh).
  # It runs here rather than from a workflow_run event because such events
  # failed at startup on GitHub's side (nameless "BuildFailed" runs, 2026-10-25).
  # release.yml keeps the manual, forced release.  Three jobs: the plan, the
  # macOS build (only when a release is due), the release.
  #
  # Whether this commit is released: a tag of this commit whose release is
  # missing is resumed, else the next version, or "skip" inside the 48 hours.
  release-plan:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-deploy, python-dist, docs-and-pages]
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    env:
      MIN_HOURS: "48"
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    - name: Plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/release-plan.sh "$GITHUB_SHA" "$MIN_HOURS" 0 >> "$GITHUB_OUTPUT"

  # A release is built on macOS too, by the same pipeline; CI is not (#1121).
  build-macos:
    needs: release-plan
    if: needs.release-plan.outputs.version != 'skip'
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-26
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  release:
    needs: [release-plan, build-macos]
    if: needs.release-plan.outputs.version != 'skip'
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      MIN_HOURS: "48"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0

    # Decided again here, inside the serialised group, against the tags as
    # they are now: another release may have been cut while macOS built.
    - name: Plan, again
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/release-plan.sh "$GITHUB_SHA" "$MIN_HOURS" 0 >> "$GITHUB_OUTPUT"

    - name: Resume a tag whose release is missing
      if: steps.plan.outputs.version == 'resume'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.plan.outputs.tag }}
      run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

    - name: Tag and release
      if: steps.plan.outputs.version != 'resume' && steps.plan.outputs.version != 'skip'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.plan.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
        git push origin "v$VERSION"
        gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
