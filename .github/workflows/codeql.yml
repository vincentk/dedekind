# CodeQL code scanning, advanced setup: findings are cues on the Security tab
# and on PRs, not a gate.  The weekly run brings new queries to unchanged code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 22 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # C/C++ is parsed without a build.  CodeQL does not read C++20
        # modules yet, which hold the library: the scan covers the files
        # around them (tests, bindings) until it does.  Without the modules
        # and headers the quality queries misread that code (an unused
        # "static variable" in a binding or a test case), so C/C++ runs the
        # security queries only, until modules are read (#1139).
        include:
          - language: actions
            queries: security-and-quality
          - language: c-cpp
            queries: security-extended
          - language: python
            queries: security-and-quality
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: ${{ matrix.queries }}
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
      with:
        category: "/language:${{ matrix.language }}"
