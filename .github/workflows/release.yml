name: Release

# A release cut by hand, on main, ignoring the 48-hour spacing by default:
# for a paper submission or a fix that should not wait.  The automatic
# release after a green build of main is the last job of cmake.yml.
# Version: 0.<YYYYMMDD>.<n>+<short hash> (see .github/scripts/release-version.sh).

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the last release is under 48 hours old"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIN_HOURS: "48"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Resume a tag whose release is missing
      id: resume
      env:
        GH_TOKEN: ${{ github.token }}
        COMMIT: ${{ github.sha }}
      run: |
        tag=$(git tag --points-at "$COMMIT" | grep '^v0\.' | head -1 || true)
        if [ -n "$tag" ] && ! gh release view "$tag" >/dev/null 2>&1; then
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          echo "resumed=1" >> "$GITHUB_OUTPUT"
        fi

    - name: Next version
      id: version
      if: steps.resume.outputs.resumed != '1'
      env:
        COMMIT: ${{ github.sha }}
        FORCE: ${{ inputs.force && '1' || '0' }}
      run: |
        v=$(.github/scripts/release-version.sh "$COMMIT" "$MIN_HOURS" "$FORCE")
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
        echo "Next version: $v"

    - name: Tag and release
      if: steps.resume.outputs.resumed != '1' && steps.version.outputs.version != 'skip'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
        COMMIT: ${{ steps.version.outputs.commit }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release $VERSION" "$COMMIT"
        git push origin "v$VERSION"
        gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
