name: Release

# A release cut by hand, on main, ignoring the 48-hour spacing by default:
# for a paper submission or a fix that should not wait.  The automatic
# release after a green build of main is the last job of cmake.yml.  Both
# build the release on macOS first (build-macos.yml); CI does not.
# Version: 0.<YYYYMMDD>.<n>, PEP 440, the tag naming the commit (see .github/scripts/release-version.sh).

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the last release is under 48 hours old"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIN_HOURS: "48"

jobs:
  # Whether this commit is released: a tag of this commit whose release is
  # missing is resumed, else the next version, or "skip".
  release-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        COMMIT: ${{ github.sha }}
        FORCE: ${{ inputs.force && '1' || '0' }}
      run: |
        tag=$(git tag --points-at "$COMMIT" | grep '^v0\.' | head -1 || true)
        if [ -n "$tag" ] && ! gh release view "$tag" >/dev/null 2>&1; then
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=resume" >> "$GITHUB_OUTPUT"
        else
          v=$(.github/scripts/release-version.sh "$COMMIT" "$MIN_HOURS" "$FORCE")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Next version: $v"
        fi

  # A release is built on macOS too (#1121).
  build-macos:
    needs: release-plan
    if: needs.release-plan.outputs.version != 'skip'
    uses: ./.github/workflows/build-macos.yml

  release:
    needs: [release-plan, build-macos]
    if: needs.release-plan.outputs.version != 'skip'
    runs-on: ubuntu-26.04  # the latest LTS, named: ubuntu-latest lags it
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Resume a tag whose release is missing
      if: needs.release-plan.outputs.version == 'resume'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.release-plan.outputs.tag }}
      run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

    - name: Tag and release
      if: needs.release-plan.outputs.version != 'resume'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.release-plan.outputs.version }}
        COMMIT: ${{ github.sha }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release $VERSION" "$COMMIT"
        git push origin "v$VERSION"
        gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
