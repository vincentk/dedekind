# TEMPORARY, to be removed before this PR is ready: what pip does today, by
# platform and route, against what is on PyPI.
name: pip probe
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pip-probe.yml]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  probe:
    name: ${{ matrix.runner }} ${{ matrix.route }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - { runner: ubuntu-26.04,   route: plain, compiler: system }
        - { runner: ubuntu-26.04,   route: sdist, compiler: system }
        - { runner: ubuntu-26.04,   route: sdist, compiler: llvm }
        - { runner: macos-26,       route: plain, compiler: system }
        - { runner: macos-26,       route: plain, compiler: llvm }
        - { runner: macos-15-intel, route: plain, compiler: system }
        - { runner: macos-15-intel, route: plain, compiler: llvm }
    steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"
    - name: LLVM (Linux)
      if: matrix.compiler == 'llvm' && runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        { echo "CC=clang-23"; echo "CXX=clang++-23"; } >> "$GITHUB_ENV"
    - name: LLVM (macOS)
      if: matrix.compiler == 'llvm' && runner.os == 'macOS'
      run: |
        brew install llvm
        root=$(brew --prefix llvm)
        { echo "CC=$root/bin/clang"; echo "CXX=$root/bin/clang++"; } >> "$GITHUB_ENV"
    - name: Compilers in view
      run: |
        uname -a
        command -v cc c++ cmake ninja || true
        c++ --version | head -2 || true
        "${CXX:-c++}" --version | head -1
    - name: pip install, in an empty directory
      env:
        ROUTE: ${{ matrix.route }}
      run: |
        cd "$(mktemp -d)"
        python -I -m venv venv
        args=()
        [ "$ROUTE" = sdist ] && args=(--no-binary pynzli)
        start=$SECONDS
        venv/bin/python -I -m pip --isolated install -v "${args[@]+"${args[@]}"}" pynzli > pip.log 2>&1 && ok=0 || ok=$?
        echo "pip exit $ok after $((SECONDS-start))s"
        grep -n -E 'Using cached|Downloading|Building wheel|CMake Error|error:|FATAL|Successfully' pip.log | head -40 | cut -c1-200 || true
        echo "--- tail"; tail -30 pip.log | cut -c1-220
        [ "$ok" = 0 ]
        venv/bin/python -I -c 'import pynzli; print("pynzli", pynzli.__version__)'
