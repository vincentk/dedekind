# The build, its tests, the linter and coverage: one pipeline, the runner its
# parameter.  CI runs it on the latest Ubuntu LTS (cmake.yml); a release runs
# it on macOS too; by hand it runs on any branch and either image
# (gh workflow run build.yml --ref <branch> -f runner=macos-26), and on macOS
# for a PR that changes this file.  Where the
# images differ, a step says so: the toolchain's install, the IR fixture
# (x86-64 IR, checked in), the Codecov upload (CI's only).
name: Build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-26.04
      upload-coverage:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-26.04, macos-26]
        default: ubuntu-26.04
      upload-coverage:
        type: boolean
        default: false
  # A PR that changes the pipeline also runs it on macOS (CI runs it on
  # Ubuntu), so a release finds it tried.
  pull_request:
    branches: [main]
    paths: [.github/workflows/build.yml]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.15"  # the latest stable, and the floor (pyproject.toml)

jobs:
  build:
    name: build (${{ inputs.runner || 'macos-26' }})
    # The latest Ubuntu LTS and the newest macOS, standard runners, named:
    # the -latest labels lag them.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # The typical job time (about 27 minutes after #1214) times 1.3, rounded
    # up to the ten: a job that runs longer has a problem to fix, not a limit
    # to raise, and fails with its log.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write  # required by codecov-action to post PR coverage comments
      actions: write  # the build cache keeps one copy: main deletes the one it replaces
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # The runner belongs to this job: give the build, the tests and the linter
    # every core (the Makefile's JOBS default leaves two free for a
    # developer's machine).
    - name: Use every core
      run: |
        echo "JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
        echo "NCPU=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The library's axioms, held as a ledger: cheap, needs no build, and fails
    # first.  A change to an axiom must change tools/jlt-lint/axioms.txt with
    # it, so that the change is in the diff, where a reviewer reads it.  The
    # ledger also goes to the run's summary.
    - name: Check the ledger of axioms
      run: |
        python3 tools/jlt-lint/axioms.py --selftest
        python3 tools/jlt-lint/axioms.py --check
        {
          echo "### The library's axioms"
          echo
          echo '```'
          grep -v '^#' tools/jlt-lint/axioms.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # The ratchet: against main, a gate of the linter may move one way only
    # (admitted up; refusals, undecided definitions and findings down), or
    # be named with its reason in tools/jlt-lint/ratchet.allow.
    - name: Ratchet the linter's gates
      run: |
        git fetch --no-tags --depth=1 origin main
        python3 tools/jlt-lint/ratchet.py FETCH_HEAD

    # The toolchain, named once: every later step reads CXX, CC and
    # CLANG_FORMAT, whichever image it runs on.  Clang's CMake packages, for
    # the linter's binary, CMake finds next to the compiler.  libc++ is not
    # built against: the linter reads its ranges library as a control, the
    # same one on every image (tools/jlt-lint/stage_stdlib.py).
    - name: Install clang build chain (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23 libstdc++-16-dev llvm-23 clang-tools-23 libclang-23-dev libclang-cpp23-dev libc++-23-dev libc++abi-23-dev
        {
          echo "CXX=clang++-23"
          echo "CC=clang-23"
          echo "CLANG_FORMAT=clang-format-23"
        } >> "$GITHUB_ENV"

    - name: Install clang build chain (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm cmake ninja
        root=$(brew --prefix llvm)
        {
          echo "CXX=$root/bin/clang++"
          echo "CC=$root/bin/clang"
          echo "CLANG_FORMAT=$root/bin/clang-format"
        } >> "$GITHUB_ENV"

    - name: Toolchain versions
      run: |
        "$CXX" --version | head -1
        cmake --version | head -1
        ninja --version

    # Create the .venv up front and prepend it to GITHUB_PATH so every
    # subsequent step uses the same virtualenv as a local dev box does.
    # Local dev: ./.venv created by the developer; CI: ./.venv created
    # here.  The Python tests import the package that
    # `make check` built and staged in build/python (PYTHONPATH), so the
    # library is compiled once; the `[tool.coverage.paths]` mapping in
    # pyproject.toml rewrites build/python/pynzli back to
    # `python/pynzli/` for the grep gate / Codecov.  The wheel job on
    # main checks that the package installs.
    - name: Set up .venv (parity with local dev)
      run: |
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        ./.venv/bin/python -m pip install --quiet --upgrade pip

    - name: Check Code Formatting
      run: make format-check CLANG_FORMAT="$CLANG_FORMAT"

    # A cache of build/ on Linux (#900): one copy, written by main under its
    # commit, read by every run for a day.  It is used only where it was built from the same inputs as
    # this run's library build: the sources it compiles, the CMake files, the
    # toolchain and the flags, hashed and stored inside the cache.  Otherwise
    # build/ is discarded and the build is clean, as without a cache.  The
    # tools and docs are not among those inputs: after a restore they are made
    # newer than build/, so whatever depends on them is rebuilt.  The release
    # jobs build their own artifacts and never read it.
    - name: The inputs of the library's build
      id: inputs
      if: runner.os == 'Linux'
      run: |
        {
          git ls-files -s src python ext CMakeLists.txt CMakePresets.json Makefile pyproject.toml
          "$CXX" --version
          cmake --version
          ninja --version
          python --version
          dpkg-query -W libstdc++-16-dev libc++-23-dev
          echo 'CMAKE_EXTRA_ARGS=-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON'
        } | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/build-inputs"
        echo "hash=$(cat "$RUNNER_TEMP/build-inputs")" >> "$GITHUB_OUTPUT"
        # A copy lives a day: it is found under today's or yesterday's date.
        echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
        echo "yesterday=$(date -u -d yesterday +%Y%m%d)" >> "$GITHUB_OUTPUT"

    - name: Restore the build of main
      id: restore
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v6
      with:
        path: build
        key: build-linux-main-${{ steps.inputs.outputs.today }}-${{ github.sha }}
        restore-keys: |
          build-linux-main-${{ steps.inputs.outputs.today }}-
          build-linux-main-${{ steps.inputs.outputs.yesterday }}-

    - name: Use the restored build only if it was built from the same inputs
      if: runner.os == 'Linux' && steps.restore.outputs.cache-matched-key != ''
      run: |
        if [ "$(cat build/.build-inputs 2>/dev/null)" = "${{ steps.inputs.outputs.hash }}" ]; then
          # The checkout made every source newer than build/.  The outputs'
          # times stay as restored, since ninja's dependency log records them;
          # the inputs the hash covers, identical by it, are made older than
          # any output instead.  tools/, docs/ and .github/ keep the
          # checkout's time, so what depends on them rebuilds.
          find src python ext cmake CMakeLists.txt CMakePresets.json Makefile pyproject.toml \
            -exec touch -h -d '2000-01-01T00:00:00Z' {} + 2>/dev/null || true
          echo "build cache: hit, ${{ steps.restore.outputs.cache-matched-key }}, $(du -sh build | cut -f1)"
        else
          echo "build cache: built from other inputs, discarded"
          rm -rf build
        fi

    # Build, then the lint in one pass over the whole tree and the tests
    # (CMake's `check`).
    - name: Build, Lint & Test
      run: |
        # The lines of ninja's log a restored cache brought in, so that the
        # timings below count only this run's edges.
        wc -l < build/.ninja_log > "$RUNNER_TEMP/ninja-log-before" 2>/dev/null || echo 0 > "$RUNNER_TEMP/ninja-log-before"
        make check CXX="$CXX" CC="$CC" CMAKE_EXTRA_ARGS="-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON"

    # Where the build's time went, on the run's page and as an artifact
    # (#900): measured before anything is optimised.
    - name: Timings
      if: always() && hashFiles('build/.ninja_log') != ''
      run: |
        python3 tools/ci/ninja_times.py build/.ninja_log --skip "$(cat "$RUNNER_TEMP/ninja-log-before" 2>/dev/null || echo 0)" >> "$GITHUB_STEP_SUMMARY"
    - name: Keep ninja's log
      if: always() && hashFiles('build/.ninja_log') != ''
      uses: actions/upload-artifact@v7
      with:
        name: ninja-log-${{ inputs.runner || 'macos-26' }}
        path: build/.ninja_log
        include-hidden-files: true
        retention-days: 30

    # The report (gates, reported counts, the syntax inventory) is kept as an
    # artifact: the paper's closure table rests on the inventory as
    # supplementary material, so the counts live here and not in the paper.
    # report.txt is the lint's report, written when the lint passes; parts/
    # keeps the findings (all.txt) for a failure.
    - name: Publish the lint report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jlt-lint-report${{ runner.os == 'macOS' && '-macos' || '' }}
        if-no-files-found: ignore
        path: |
          build/jlt-lint/report.txt
          build/jlt-lint/parts/*.txt

    # The checked-in IR is x86-64's: it is read where it was written.
    - name: Validate Checked-In LLVM IR Fixture
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: make ir-fixture-check CXX="$CXX"

    # Regenerate the IR snapshots from source and publish them, so a stale
    # checked-in .ll can be refreshed from CI output without a local build.
    - name: Refresh LLVM IR Snapshots
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: make ir-fixture-refresh CXX="$CXX"

    - name: Upload Refreshed LLVM IR Snapshots
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: actions/upload-artifact@v7
      with:
        name: ir-fixtures
        if-no-files-found: error
        path: src/test/cpp/modules/dedekind/python/*.ll

    # The profiles of the tests `make check` ran.
    - name: Process Coverage Data
      run: cmake --build build --target generate_coverage

    - name: Collect Python Coverage
      run: |
        make python-coverage
        grep -q "python/pynzli/" build/python-coverage.xml

    - name: Upload to Codecov
      if: inputs.upload-coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        files: build/coverage.info,build/python-coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    # main keeps the build it has just made, and only the newest copy, after
    # coverage has read the tests' profiles: they are deleted first, since
    # actions/cache does not honour negated paths, and the path is the
    # restore's, since the path list is part of the cache's version.
    - name: Mark the build with its inputs
      if: success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        find build \( -name '*.profraw' -o -name '*.profdata' \) -delete
        cp "$RUNNER_TEMP/build-inputs" build/.build-inputs
        echo "build cache: saving $(du -sh build | cut -f1)"
    - name: Save the build for later runs
      if: success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: build
        key: build-linux-main-${{ steps.inputs.outputs.today }}-${{ github.sha }}
    - name: Keep one copy
      if: success() && runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --key build-linux- --json id,key \
          --jq '.[] | select(.key != "build-linux-main-${{ steps.inputs.outputs.today }}-${{ github.sha }}") | .id' |
          xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
