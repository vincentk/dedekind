# The build, its tests, the linter and coverage: one pipeline, the runner its
# parameter.  CI runs it on the latest Ubuntu LTS (cmake.yml); a release runs
# it on macOS too; by hand it runs on any branch and either image
# (gh workflow run build.yml --ref <branch> -f runner=macos-26), and on macOS
# for a PR that changes this file.  Where the
# images differ, a step says so: the toolchain's install, the IR fixture
# (x86-64 IR, checked in), the Codecov upload (CI's only).
name: Build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-26.04
      upload-coverage:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-26.04, macos-26]
        default: ubuntu-26.04
      upload-coverage:
        type: boolean
        default: false
  # A PR that changes the pipeline also runs it on macOS (CI runs it on
  # Ubuntu), so a release finds it tried.
  pull_request:
    branches: [main]
    paths: [.github/workflows/build.yml]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.15"  # the latest stable, and the floor (pyproject.toml)

jobs:
  build:
    name: build (${{ inputs.runner || 'macos-26' }})
    # The latest Ubuntu LTS and the newest macOS, standard runners, named:
    # the -latest labels lag them.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    permissions:
      contents: read
      pull-requests: write  # required by codecov-action to post PR coverage comments
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    # The runner belongs to this job: give the build, the tests and the linter
    # every core (the Makefile's JOBS default leaves two free for a
    # developer's machine).
    - name: Use every core
      run: |
        echo "JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
        echo "NCPU=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The toolchain, named once: every later step reads CXX, CC and
    # CLANG_FORMAT, whichever image it runs on.  The linter's clang-query and
    # Clang's CMake packages CMake finds next to the compiler.
    - name: Install clang build chain (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23 libstdc++-16-dev llvm-23 clang-tools-23 libclang-23-dev libclang-cpp23-dev
        {
          echo "CXX=clang++-23"
          echo "CC=clang-23"
          echo "CLANG_FORMAT=clang-format-23"
        } >> "$GITHUB_ENV"

    - name: Install clang build chain (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm cmake ninja
        root=$(brew --prefix llvm)
        {
          echo "CXX=$root/bin/clang++"
          echo "CC=$root/bin/clang"
          echo "CLANG_FORMAT=$root/bin/clang-format"
        } >> "$GITHUB_ENV"

    - name: Toolchain versions
      run: |
        "$CXX" --version | head -1
        cmake --version | head -1
        ninja --version

    # Create the .venv up front and prepend it to GITHUB_PATH so every
    # subsequent step uses the same virtualenv as a local dev box does.
    # Local dev: ./.venv created by the developer; CI: ./.venv created
    # here.  The Python tests import the package that
    # `make check` built and staged in build/python (PYTHONPATH), so the
    # library is compiled once; the `[tool.coverage.paths]` mapping in
    # pyproject.toml rewrites build/python/pynzli back to
    # `python/pynzli/` for the grep gate / Codecov.  The wheel job on
    # main checks that the package installs.
    - name: Set up .venv (parity with local dev)
      run: |
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        ./.venv/bin/python -m pip install --quiet --upgrade pip

    - name: Check Code Formatting
      run: make format-check CLANG_FORMAT="$CLANG_FORMAT"

    # The linter's own binary changes rarely and takes many minutes to build;
    # kept between runs, keyed on its sources and the toolchain, it no longer
    # competes with the compilation for the cores.
    - name: Toolchain key
      id: toolchain
      run: echo "llvm=$("$CXX" --version | head -1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

    - name: Restore the jlt-lint tool
      id: jlt-tool
      uses: actions/cache@v6
      with:
        path: .jlt-lint-tool
        key: jlt-lint-tool-${{ runner.os }}-${{ steps.toolchain.outputs.llvm }}-${{ hashFiles('tools/jlt-lint/tool/**') }}

    # Build, then the lint in one pass over the whole tree and the tests
    # (CMake's `check`).
    - name: Build, Lint & Test
      run: |
        tool=""
        if [ -x .jlt-lint-tool/jlt-lint ]; then tool="-DDEDEKIND_JLT_LINT_TOOL=$PWD/.jlt-lint-tool/jlt-lint"; fi
        make check CXX="$CXX" CC="$CC" CMAKE_EXTRA_ARGS="-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON $tool"

    - name: Keep the jlt-lint tool
      if: steps.jlt-tool.outputs.cache-hit != 'true'
      run: mkdir -p .jlt-lint-tool && cp build/jlt-lint/jlt-lint .jlt-lint-tool/

    # The report (gates, reported counts, the syntax inventory) is kept as an
    # artifact: the paper's closure table rests on the inventory as
    # supplementary material, so the counts live here and not in the paper.
    # report.txt is the lint's report, written when the lint passes; parts/
    # keeps the findings (all.txt) for a failure.
    - name: Publish the lint report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jlt-lint-report${{ runner.os == 'macOS' && '-macos' || '' }}
        if-no-files-found: ignore
        path: |
          build/jlt-lint/report.txt
          build/jlt-lint/parts/*.txt

    # The checked-in IR is x86-64's: it is read where it was written.
    - name: Validate Checked-In LLVM IR Fixture
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: make ir-fixture-check CXX="$CXX"

    # Regenerate the IR snapshots from source and publish them, so a stale
    # checked-in .ll can be refreshed from CI output without a local build.
    - name: Refresh LLVM IR Snapshots
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: make ir-fixture-refresh CXX="$CXX"

    - name: Upload Refreshed LLVM IR Snapshots
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: actions/upload-artifact@v7
      with:
        name: ir-fixtures
        if-no-files-found: error
        path: src/test/cpp/modules/dedekind/python/*.ll

    # The profiles of the tests `make check` ran.
    - name: Process Coverage Data
      run: cmake --build build --target generate_coverage

    - name: Collect Python Coverage
      run: |
        make python-coverage
        grep -q "python/pynzli/" build/python-coverage.xml

    - name: Upload to Codecov
      if: inputs.upload-coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        files: build/coverage.info,build/python-coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true
