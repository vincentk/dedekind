# The build, its tests, the linter and coverage: one pipeline, the runner its
# parameter.  CI runs it on the latest Ubuntu LTS (cmake.yml); a release runs
# it on macOS too; by hand it runs on any branch and either image
# (gh workflow run build.yml --ref <branch> -f runner=macos-26), and on macOS
# for a PR that changes this file.  Where the
# images differ, a step says so: the toolchain's install, the IR fixture
# (x86-64 IR, checked in), the Codecov upload (CI's only).
name: Build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-26.04
      upload-coverage:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [ubuntu-26.04, macos-26]
        default: ubuntu-26.04
      upload-coverage:
        type: boolean
        default: false
  # A PR that changes the pipeline also runs it on macOS (CI runs it on
  # Ubuntu), so a release finds it tried.
  pull_request:
    branches: [main]
    paths: [.github/workflows/build.yml]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.15"  # the latest stable, and the floor (pyproject.toml)

jobs:
  build:
    name: build (${{ inputs.runner || 'macos-26' }})
    # The latest Ubuntu LTS and the newest macOS, standard runners, named:
    # the -latest labels lag them.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    permissions:
      contents: read
      pull-requests: write  # required by codecov-action to post PR coverage comments
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        submodules: recursive

    # The runner belongs to this job: give the build, ctest and the linter
    # every core (the Makefile's JOBS default leaves two free for a
    # developer's machine).
    - name: Use every core
      run: |
        echo "JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
        echo "NCPU=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # The toolchain, named once: every later step reads CXX, CC,
    # CLANG_FORMAT, CLANG_QUERY and LLVM_ROOT, whichever image it runs on.
    - name: Install clang build chain (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt-get install -y clang-23 ninja-build clang-format-23 llvm-23 clang-tools-23 libclang-23-dev libclang-cpp23-dev
        {
          echo "CXX=clang++-23"
          echo "CC=clang-23"
          echo "CLANG_FORMAT=clang-format-23"
          echo "CLANG_QUERY=clang-query-23"
          echo "LLVM_ROOT=/usr/lib/llvm-23"
        } >> "$GITHUB_ENV"

    - name: Install clang build chain (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm cmake ninja
        root=$(brew --prefix llvm)
        {
          echo "CXX=$root/bin/clang++"
          echo "CC=$root/bin/clang"
          echo "CLANG_FORMAT=$root/bin/clang-format"
          echo "CLANG_QUERY=$root/bin/clang-query"
          echo "LLVM_ROOT=$root"
        } >> "$GITHUB_ENV"

    - name: Toolchain versions
      run: |
        "$CXX" --version | head -1
        cmake --version | head -1
        ninja --version

    # Create the .venv up front and prepend it to GITHUB_PATH so every
    # subsequent step uses the same virtualenv as a local dev box does.
    # Local dev: ./.venv created by the developer; CI: ./.venv created
    # here.  The notebooks and the Python tests import the package that
    # `make test` built and staged in build/python (PYTHONPATH), so the
    # library is compiled once; the `[tool.coverage.paths]` mapping in
    # pyproject.toml rewrites build/python/pynzli back to
    # `python/pynzli/` for the grep gate / Codecov.  The wheel job on
    # main checks that the package installs.
    - name: Set up .venv (parity with local dev)
      run: |
        python -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        ./.venv/bin/python -m pip install --quiet --upgrade pip

    - name: Check Code Formatting
      run: make format-check CLANG_FORMAT="$CLANG_FORMAT"

    - name: Build & Run Integration Tests
      run: make integration-test CXX="$CXX" CC="$CC" CMAKE_EXTRA_ARGS="-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON"

    - name: Jlt Lint (post-processing over the compilation database)
      run: >-
        make jlt-lint CLANG_QUERY="$CLANG_QUERY" LLVM_ROOT="$LLVM_ROOT"
        JLT_LINT_CMAKE_ARGS="-DCMAKE_CXX_COMPILER=$CXX -DCMAKE_C_COMPILER=$CC
        -DClang_DIR=$LLVM_ROOT/lib/cmake/clang -DLLVM_DIR=$LLVM_ROOT/lib/cmake/llvm"

    # The checked-in IR is x86-64's: it is read where it was written.
    - name: Validate Checked-In LLVM IR Fixture
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: make ir-fixture-check CXX="$CXX"

    # Regenerate the IR snapshots from source and publish them, so a stale
    # checked-in .ll can be refreshed from CI output without a local build.
    - name: Refresh LLVM IR Snapshots
      if: runner.os == 'Linux' && runner.arch == 'X64'
      run: make ir-fixture-refresh CXX="$CXX"

    - name: Upload Refreshed LLVM IR Snapshots
      if: runner.os == 'Linux' && runner.arch == 'X64'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: ir-fixtures
        if-no-files-found: error
        path: src/test/cpp/modules/dedekind/python/*.ll

    - name: Process Coverage Data
      run: make coverage CXX="$CXX" CC="$CC" CMAKE_EXTRA_ARGS="-DDEDEKIND_RUNTIME_COVERAGE_BRIDGES=ON"

    - name: Collect Python Coverage
      run: |
        make python-coverage
        grep -q "python/pynzli/" build/python-coverage.xml

    - name: Upload to Codecov
      if: inputs.upload-coverage
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
      with:
        files: build/coverage.info,build/python-coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    # Diagnostic artifact upload — runs regardless of earlier-step outcome so
    # the rendered notebooks are available for offline inspection even when a
    # critical-path step (coverage, Codecov upload) fails. Placed at the tail
    # so the critical path reads top-to-bottom without diagnostic noise.
    - name: Upload Notebook Integration Artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: python-notebooks${{ runner.os == 'macOS' && '-macos' || '' }}
        if-no-files-found: warn
        path: |
          build/python-notebooks/*.ipynb
          build/python-notebooks/integration-summary.txt
