# A wheel built at <version>, from an artifact into dist/ for an upload: one
# definition for the jobs that publish (the release; a PR labelled testpypi).
# The upload itself is the job's own step, pypa/gh-action-pypi-publish, a
# Docker action that does not run inside a composite action.
name: The wheel to publish
description: An artifact's wheel at a version, in dist/
inputs:
  artifact:
    description: The artifact holding the wheel (python-dist, release-dist)
    required: true
  version:
    description: The version the wheel was built at
    required: true
runs:
  using: composite
  steps:
  - name: The wheel built
    uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
    with:
      name: ${{ inputs.artifact }}
      path: wheel-artifact

  # The wheel must carry the version asked for: one built at another (a
  # release cut meanwhile) stops here, before anything is published.
  - name: The wheel at this version
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
    run: |
      pynzli=$(find wheel-artifact -name "pynzli-$VERSION*" -type f)
      ls $pynzli
      mkdir -p dist && cp $pynzli dist/
      ls dist/pynzli-"$VERSION"-*.whl

