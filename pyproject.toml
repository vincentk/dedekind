[build-system]
requires = ["scikit-build-core>=1.1"]
build-backend = "scikit_build_core.build"

[project]
name = "pynzli"
dynamic = ["version"]
description = "A library of structure-preserving combinators."
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
authors = [
  { name = "Dedekind Authors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/vincentk/dedekind"

# The version is python/pynzli/_version.py's: 0.0.0.dev0 in the tree, the
# release's 0.<YYYYMMDD>.<n> written there by CI before a release's wheel is
# built (.github/scripts/release-version.sh).
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/pynzli/_version.py"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build-python/{wheel_tag}"
wheel.packages = ["python/pynzli"]
# Scope the editable / wheel install to the nanobind extension targets
# only.  CMake's dependency graph still pulls in the layer libraries
# transitively (_pst → dedekind_optimization → … → dedekind_category),
# so the link is correct.  Skipped: 13 test executables (each linking
# Catch2 + multiple layer static libs) plus the IR-fixture target.
# That's where ~5–10 minutes of CI wall time go on every Python-touch
# run.  Closes #426.  `make test` continues to invoke `cmake --build`
# directly with the full target set, so the test suite is untouched.
# All extensions must be listed: they are install(TARGETS) targets, so a
# missing one fails the wheel install (#961: _jlt is the Jlt arrow exhibit;
# #1001: _pst the Pst chains, with the term surface over u64 and 𝔽ₚ).
build.targets = ["_jlt", "_pst"]
# One wheel per platform for every Python from 3.15, the floor, through the
# stable ABI (the modules are nanobind STABLE_ABI, CMakeLists.txt): tagged
# cp315-abi3.
wheel.py-api = "cp315"

[tool.scikit-build.cmake.define]
DEDEKIND_BUILD_PYTHON_BINDINGS = "ON"
DEDEKIND_ENABLE_DOUBLE_REAL_PROXY = "ON"

[project.optional-dependencies]
graphblas = [
  "python-graphblas[default]>=2025.2.0",
]

test = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "numpy>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]

[tool.coverage.run]
source = ["python/pynzli"]
omit = ["*/__pycache__/*"]

# Path-mapping: when CI installs the dedekind wheel into site-packages
# (or a venv), coverage records the physical site-packages paths.  This
# mapping rewrites them back to the source-tree path so:
#   * the XML's <class filename="..."> attributes reference
#     `python/pynzli/...`, satisfying the workflow gate
#     `grep -q "python/pynzli/" build/python-coverage.xml` in
#     `.github/workflows/cmake.yml`;
#   * Codecov / IDE jump-to-source resolves to the actual source files
#     rather than to read-only installed copies.
[tool.coverage.paths]
source = [
    "python/pynzli",
    "*/site-packages/pynzli",
    "*/pynzli",
]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "build/python-coverage.xml"